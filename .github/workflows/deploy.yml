name: Deploy to GitHub Pages

on:
  # Run on every push to main
  push:
    branches: [main]
  # Allow manual runs from the Actions tab
  workflow_dispatch:

# Permissions needed for the Pages deployment action
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; cancel any in-progress deploy if a new commit lands
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Tell Next.js the deployment is going to GitHub Pages
          static_site_generator: next

      - name: Install dependencies
        run: npm ci

      - name: "Build (next build with output: 'export')"
        run: npm run build

      - name: Add .nojekyll
        # Prevents GitHub Pages from running Jekyll on the site, which would
        # break filenames that start with an underscore (like Next.js's _next/)
        run: touch ./out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
